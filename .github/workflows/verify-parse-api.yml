name: Verify Parse API Configuration

on:
  push:
    branches:
      - ci
  workflow_dispatch:

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel Production Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Compare parsing API URL without exposing values
        env:
          EXPECTED_PARSE_API_URL: ${{ secrets.PARSE_API_URL_EXACT }}
          EXPECTED_PARSE_API_URL_TRAILING_SPACE: ${{ secrets.PARSE_API_URL_TRAILING_SPACE }}
          EXPECTED_PARSE_API_URL_API_GATEWAY: ${{ secrets.PARSE_API_URL_API_GATEWAY }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const entry = fs
            .readFileSync('.vercel/.env.production.local', 'utf8')
            .split(/\r?\n/)
            .find((line) => line.startsWith('NEXT_PUBLIC_PARSE_API_PATH='));

          if (entry == null) {
            throw new Error('NEXT_PUBLIC_PARSE_API_PATH is not configured in Vercel Production');
          }

          const raw = entry.slice('NEXT_PUBLIC_PARSE_API_PATH='.length);
          const actual = raw.startsWith('"') && raw.endsWith('"') ? JSON.parse(raw) : raw;
          console.log(`parse_api_url_exact_match=${actual === process.env.EXPECTED_PARSE_API_URL}`);
          console.log(
            `parse_api_url_trailing_space_match=${actual === process.env.EXPECTED_PARSE_API_URL_TRAILING_SPACE}`
          );
          console.log(
            `parse_api_url_api_gateway_match=${actual === process.env.EXPECTED_PARSE_API_URL_API_GATEWAY}`
          );
          NODE
